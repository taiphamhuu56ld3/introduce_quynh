<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tai Blog Website</title>
    <!-- Primary meta tags -->
    <meta name="title" content="TaiPham - Blog Website" />
    <meta
      name="description"
      content="This is a blog html made by Coding TaiPham"
    />

    <!-- Custom css link -->
    <link rel="stylesheet" href="assets/css/style.css" />

</head>
<body>
    <!-- Header section -->
    <header class="header" data-header>
        <div class="container">
          <a href="#" class="logo">
            <img
              width="119"
              height="37"
              src="assets/img/temp_pic.png"
              alt="Tai logo"
            />
          </a>
  
          <nav class="navbar" data-navbar>
            <div class="navbar-top">
              <a href="#" class="logo">
                <img
                  width="119"
                  height="37"
                  src="assets/img/logo.svg"
                  alt="Tai logo"
                />
              </a>
  
              <button
                class="nav-close-btn"
                aria-label="close menu"
                data-nav-toggler
              >
                <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
              </button>
            </div>
  
            <ul class="navbar-list">
              <li>
                <a href="#home" class="navbar-link hover-1" data-nav-toggler>
                  Home
                </a>
              </li>
  
              <li>
                <a href="#topics" class="navbar-link hover-1" data-nav-toggler>
                  Topics
                </a>
              </li>
  
              <li>
                <a href="#featured" class="navbar-link hover-1" data-nav-toggler>
                  Featured Post
                </a>
              </li>
  
              <li>
                <a href="#recent" class="navbar-link hover-1" data-nav-toggler>
                  Recent Post
                </a>
              </li>
  
              <li>
                <a href="#contact" class="navbar-link hover-1" data-nav-toggler>
                  Contact
                </a>
              </li>
            </ul>
  
            <div class="navbar-bottom">
              <div class="profile-card">
                <img
                  src="assets/img/temp_pic.png"
                  class="profile-banner"
                  width="48"
                  height="48"
                  alt="Tai Pham"
                />
  
                <div>
                  <p class="card-title">Hello Tai !</p>
  
                  <p class="card-subtitle">You have some new messages</p>
                </div>
              </div>
  
              <ul class="link-list">
                <li>
                  <a href="#" class="navbar-bottom-link hover-1"> Profile </a>
                </li>
  
                <li>
                  <a href="#" class="navbar-bottom-link hover-1">
                    Articles Saved
                  </a>
                </li>
  
                <li>
                  <a href="#" class="navbar-bottom-link hover-1">
                    Add New Post
                  </a>
                </li>
  
                <li>
                  <a href="#" class="navbar-bottom-link hover-1"> My Likes </a>
                </li>
  
                <li>
                  <a href="#" class="navbar-bottom-link hover-1">
                    Account Setting
                  </a>
                </li>
  
                <li>
                  <a href="#" class="navbar-bottom-link hover-1"> Sign Out </a>
                </li>
              </ul>
            </div>
  
            <p class="copyright-text">
              Copyright 2025 © TaiPham - Blog. Developed by coding Tai Pham
            </p>
          </nav>
  
          <a href="#" class="btn btn-primary">Subscribe</a>
  
          <button class="nav-open-btn" aria-label="open menu" data-nav-toggler>
            <ion-icon name="menu-outline" aria-hidden="true"></ion-icon>
          </button>
        </div>
    </header>
</body>
</html>
